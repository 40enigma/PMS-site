<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Crystalline Unit Cell Hexagonal / BCC Geometry -->
  <polygon points="32,6 56,19 56,45 32,58 8,45 8,19" stroke="#ededed" stroke-width="2.5" stroke-linejoin="round" fill="#141415"/>
  
  <!-- Interior Crystal Lattice Vectors -->
  <line x1="32" y1="6" x2="32" y2="32" stroke="rgba(237,237,237,0.4)" stroke-width="1.75"/>
  <line x1="56" y1="19" x2="32" y2="32" stroke="rgba(237,237,237,0.4)" stroke-width="1.75"/>
  <line x1="56" y1="45" x2="32" y2="32" stroke="rgba(237,237,237,0.4)" stroke-width="1.75"/>
  <line x1="32" y1="58" x2="32" y2="32" stroke="rgba(237,237,237,0.4)" stroke-width="1.75"/>
  <line x1="8" y1="45" x2="32" y2="32" stroke="rgba(237,237,237,0.4)" stroke-width="1.75"/>
  <line x1="8" y1="19" x2="32" y2="32" stroke="rgba(237,237,237,0.4)" stroke-width="1.75"/>

  <!-- Lattice Vertex Atoms -->
  <circle cx="32" cy="6" r="3" fill="#ededed"/>
  <circle cx="56" cy="19" r="3" fill="#ededed"/>
  <circle cx="56" cy="45" r="3" fill="#ededed"/>
  <circle cx="32" cy="58" r="3" fill="#ededed"/>
  <circle cx="8" cy="45" r="3" fill="#ededed"/>
  <circle cx="8" cy="19" r="3" fill="#ededed"/>

  <!-- Interstitial Atom Core (Tempered Bronze Accent) -->
  <circle cx="32" cy="32" r="4.5" fill="#e59a3c"/>
  <circle cx="32" cy="32" r="2" fill="#141415"/>
</svg>
