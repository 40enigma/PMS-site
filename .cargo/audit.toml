# Cargo-audit configuration for pms-platform.
# Only list reviewed advisories that cannot be resolved via Cargo dependency updates yet.

[advisories]
ignore = [
    # rsa 0.9.10 appears in Cargo.lock solely via sqlx's inactive optional `sqlx-mysql` feature.
    # `pms-platform` enables only `sqlite` and does not compile or link `rsa` (`cargo tree -i rsa` is empty).
    "RUSTSEC-2023-0071",

    # libsqlite3-sys 0.30.1 (bundled SQLite < 3.54.0, local untrusted db + mismatched -wal vector).
    # `sqlx-sqlite` 0.8.6 (and 0.9.0) constrains `libsqlite3-sys < 0.38.0`, blocking >= 0.39.0;
    # `pms-platform` only opens its own local application database file.
    "RUSTSEC-2026-0459",
]

